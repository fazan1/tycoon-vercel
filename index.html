<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<title>My Tycoon Advisors</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #F7F3EC;
  --bg-2: #FBF8F2;
  --surface: #FFFFFF;
  --surface-2: #F3EEE5;
  --surface-3: #ECE6DA;
  --gold: #C9A24B;
  --gold-dark: #9A7A2E;
  --gold-light: #B8901F;
  --gold-soft: rgba(201,162,75,0.10);
  --gold-line: rgba(201,162,75,0.30);
  --gold-grad: linear-gradient(135deg, #D4A93F 0%, #C9A24B 45%, #9A7A2E 100%);
  --black: #2B2620;
  --ink: #2B2620;
  --ink-soft: #5C564C;
  --gray-dark: #5C564C;
  --gray-mid: #8A8275;
  --gray-light: #A9A092;
  --border: rgba(43,38,32,0.08);
  --border-2: rgba(43,38,32,0.13);
  --shadow-sm: 0 1px 3px rgba(43,38,32,0.06);
  --shadow: 0 6px 24px rgba(43,38,32,0.08);
  --shadow-lg: 0 16px 48px rgba(43,38,32,0.12);
  --font-display: 'Fraunces', 'Newsreader', Georgia, serif;
  --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
}

html, body {
  height: 100%;
  background:
    radial-gradient(1200px 700px at 50% -10%, rgba(201,162,75,0.06), transparent 60%),
    var(--bg);
  overflow: hidden;
  -webkit-text-size-adjust: 100%;
  -webkit-overflow-scrolling: touch;
}

body {
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 14px;
  line-height: 1.55;
  height: 100dvh; height: 100vh; height: -webkit-fill-available;
  -webkit-font-smoothing: antialiased;
  letter-spacing: -0.011em;
  display: flex;
  flex-direction: column;
}

#wrap {
  background: transparent;
  flex: 1;
  width: 100%;
  display: flex;
  flex-direction: column;
  max-width: 720px;
  margin: 0 auto;
  position: relative;
  overflow: hidden;
  z-index: 1;
  min-height: 0;
}

/* ========== SELECTOR ========== */
#selector {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 48px 20px 70px;
  scrollbar-width: none;
  touch-action: pan-y;
  background: transparent;
}

#selector::-webkit-scrollbar { display: none; }

.sel-title {
  text-align: center;
  font-family: var(--font-display);
  font-optical-sizing: auto;
  font-size: 54px;
  font-weight: 400;
  color: var(--ink);
  margin-bottom: 14px;
  margin-top: 12px;
  letter-spacing: -0.03em;
  line-height: 1.0;
}
.sel-title .gild {
  background: var(--gold-grad);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  font-style: italic;
}

.sel-sub {
  text-align: center;
  font-size: 11px;
  color: var(--gold-dark);
  margin-bottom: 38px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  font-weight: 600;
  opacity: 0.85;
}

#nameSetup { display: flex; gap: 8px; margin-bottom: 16px; }

#nameInp {
  flex: 1;
  background: var(--surface);
  border: 1px solid var(--border-2);
  border-radius: 14px;
  color: var(--ink);
  padding: 14px 18px;
  font-size: 14px;
  outline: none;
  font-family: inherit;
  font-weight: 500;
  box-shadow: var(--shadow-sm);
  transition: all 0.2s;
}

#nameInp::placeholder { color: var(--gray-light); }
#nameInp:focus { border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold-soft); }

#nameSave {
  background: var(--gold-grad);
  border: none;
  border-radius: 14px;
  color: #1a1505;
  padding: 14px 22px;
  font-size: 13px;
  cursor: pointer;
  font-family: inherit;
  font-weight: 700;
  letter-spacing: 0.02em;
  box-shadow: 0 6px 20px rgba(201,162,75,0.3);
  transition: all 0.2s;
}

#nameSave:hover { transform: translateY(-1px); box-shadow: 0 10px 28px rgba(201,162,75,0.45); }

/* ========== GRID & CARDS ========== */
#grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
@media (min-width: 500px) { #grid { grid-template-columns: repeat(3, 1fr); } }
@media (min-width: 768px) { #grid { grid-template-columns: repeat(4, 1fr); } }

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 22px;
  padding: 28px 18px 22px;
  cursor: pointer;
  text-align: center;
  position: relative;
  overflow: hidden;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  -webkit-tap-highlight-color: transparent;
  min-height: 166px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  box-shadow: var(--shadow-sm);
}

.card::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(120px 80px at 50% 0%, var(--gold-soft), transparent 70%);
  opacity: 0;
  transition: opacity 0.3s;
}

.card::after {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: var(--gold-grad);
  opacity: 0;
  transition: opacity 0.3s;
}

.card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); border-color: var(--gold-line); }
.card:hover::after { opacity: 1; }
.card:hover::before { opacity: 1; }
.card:active { transform: translateY(0) scale(0.98); transition: all 0.1s; }

.card-emoji { font-size: 38px; display: block; margin-bottom: 14px; position: relative; }

.card-name {
  font-family: var(--font-display);
  font-size: 17px;
  font-weight: 500;
  color: var(--ink);
  margin-bottom: 6px;
  line-height: 1.18;
  letter-spacing: -0.02em;
  position: relative;
}

.card-sub { font-size: 10.5px; color: var(--gray-mid); line-height: 1.45; margin-bottom: 12px; position: relative; }

.card-tag {
  display: inline-block;
  font-size: 9px;
  padding: 4px 11px;
  border-radius: 100px;
  background: var(--gold-soft);
  color: var(--gold-dark);
  letter-spacing: 0.06em;
  font-weight: 600;
  text-transform: uppercase;
  border: 1px solid var(--gold-line);
  position: relative;
}

/* ========== CHAT VIEW ========== */
#chat { display: none; flex-direction: column; flex: 1; overflow: hidden; min-height: 0; background: transparent; }

#hdr {
  padding: 12px 16px;
  padding-top: calc(12px + env(safe-area-inset-top));
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border);
  background: rgba(247,243,236,0.85);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  position: sticky;
  top: 0;
  z-index: 10;
}

#backbtn {
  background: var(--surface-2);
  border: 1px solid var(--border-2);
  color: var(--ink-soft);
  border-radius: 100px;
  padding: 7px 12px;
  font-size: 14px;
  cursor: pointer;
  font-family: inherit;
  font-weight: 600;
  box-shadow: var(--shadow-sm);
  transition: all 0.15s;
  flex-shrink: 0;
}

#backbtn:hover { border-color: var(--gold); color: var(--gold-light); }

#syncNowBtn {
  background: var(--surface-2);
  border: 1px solid var(--border-2);
  color: var(--gray-mid);
  border-radius: 100px;
  padding: 7px 10px;
  font-size: 13px;
  cursor: pointer;
  font-family: inherit;
  font-weight: 600;
  box-shadow: var(--shadow-sm);
  flex-shrink: 0;
}

#hav {
  width: 38px;
  height: 38px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  flex-shrink: 0;
  background: linear-gradient(135deg, #2a2410, #1a1608);
  border: 1px solid var(--gold-line);
  box-shadow: 0 2px 10px rgba(201,162,75,0.18);
}

#hinfo { flex: 1; min-width: 0; }

#hname {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 15px;
  color: var(--ink);
  letter-spacing: -0.015em;
  line-height: 1.2;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

#hsub { font-size: 11px; color: var(--gray-mid); margin-top: 2px; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.hbtn {
  background: var(--surface-2);
  border: 1px solid var(--border-2);
  color: var(--gray-mid);
  border-radius: 10px;
  padding: 7px 10px;
  font-size: 14px;
  cursor: pointer;
  box-shadow: var(--shadow-sm);
  transition: all 0.15s;
}

.hbtn:hover { border-color: var(--gold); color: var(--gold); }

#modeIndicator {
  padding: 8px 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  font-size: 11px;
  color: var(--gray-mid);
  letter-spacing: -0.01em;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

#modeIndicator b { color: var(--gold-light); font-weight: 700; }

#deepToggle {
  background: var(--surface-2);
  border: 1px solid var(--border-2);
  color: var(--gray-mid);
  border-radius: 100px;
  padding: 4px 12px;
  font-size: 10px;
  cursor: pointer;
  font-family: inherit;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  flex-shrink: 0;
  box-shadow: var(--shadow-sm);
}

#modebar {
  display: flex;
  gap: 6px;
  padding: 10px 16px;
  background: var(--bg-2);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}

#modebar::-webkit-scrollbar { display: none; }

.modeBtn {
  background: var(--surface-2);
  border: 1px solid var(--border-2);
  color: var(--gray-mid);
  padding: 7px 14px;
  border-radius: 100px;
  font-size: 11px;
  cursor: pointer;
  font-family: inherit;
  white-space: nowrap;
  flex-shrink: 0;
  font-weight: 600;
  letter-spacing: 0.02em;
  transition: all 0.15s;
  -webkit-tap-highlight-color: transparent;
}

.modeBtn:hover { border-color: var(--gold); color: var(--gold-light); }

.modeBtn.active {
  background: var(--gold-grad);
  color: #1a1505;
  border-color: transparent;
  box-shadow: 0 4px 16px rgba(201,162,75,0.3);
}

#memPanel {
  display: none;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 12px 16px;
  flex-shrink: 0;
}

#memPanel h4 { font-size: 11px; color: var(--gold-light); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 700; }
#memContent { font-size: 12px; color: var(--ink-soft); line-height: 1.7; }

#memClear {
  margin-top: 8px;
  background: transparent;
  border: 1px solid #fca5a5;
  color: #ef4444;
  border-radius: 100px;
  padding: 5px 14px;
  font-size: 11px;
  cursor: pointer;
  font-family: inherit;
  font-weight: 600;
}

#msgs {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 20px 16px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  min-height: 0;
  scrollbar-width: none;
  background: transparent;
}

#msgs::-webkit-scrollbar { display: none; }

.msg { display: flex; gap: 10px; align-items: flex-start; }
.msg.user { flex-direction: row-reverse; }

.mav {
  width: 30px;
  height: 30px;
  border-radius: 10px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 15px;
  background: linear-gradient(135deg, #2a2410, #1a1608);
  border: 1px solid var(--gold-line);
}

.bub {
  max-width: 85%;
  padding: 13px 16px;
  font-size: 14px;
  line-height: 1.65;
  white-space: pre-wrap;
  word-wrap: break-word;
  font-family: inherit;
  letter-spacing: -0.005em;
}

.bub.ai {
  border-radius: 16px 16px 16px 4px;
  background: var(--surface);
  color: var(--ink);
  border: 1px solid var(--border-2);
  box-shadow: var(--shadow-sm);
}

.bub.user {
  border-radius: 16px 16px 4px 16px;
  background: var(--gold-grad);
  color: #1a1505;
  border: none;
  font-weight: 500;
  box-shadow: 0 4px 16px rgba(201,162,75,0.25);
}

.msg-actions { display: flex; gap: 6px; margin-top: 6px; }

.msg-act {
  background: var(--surface-2);
  border: 1px solid var(--border-2);
  color: var(--gray-mid);
  padding: 5px 12px;
  font-size: 12px;
  cursor: pointer;
  font-family: inherit;
  border-radius: 8px;
  font-weight: 500;
  transition: all 0.15s;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  box-shadow: var(--shadow-sm);
}

.msg-act:hover { border-color: var(--gold); color: var(--gold-light); background: var(--surface-3); }

.badge {
  font-size: 10px;
  padding: 3px 10px;
  background: var(--gold-soft);
  color: var(--gold-light);
  border-radius: 100px;
  display: inline-block;
  font-weight: 600;
  letter-spacing: 0.04em;
  border: 1px solid var(--gold-line);
}

#chipswrap { padding: 8px 16px; }
#chips { display: flex; flex-wrap: wrap; gap: 7px; }

.chip {
  background: var(--surface-2);
  border: 1px solid var(--border-2);
  color: var(--ink-soft);
  padding: 8px 16px;
  border-radius: 100px;
  font-size: 12px;
  cursor: pointer;
  font-family: inherit;
  font-weight: 500;
  box-shadow: var(--shadow-sm);
  transition: all 0.15s;
  -webkit-tap-highlight-color: transparent;
}

.chip:hover, .chip:active { background: var(--surface-3); border-color: var(--gold); color: var(--gold-light); }

#typingrow { display: none; }

.tdot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--gold);
  display: inline-block;
  animation: bnc 1s infinite;
}

.tdot:nth-child(2) { animation-delay: 0.15s; }
.tdot:nth-child(3) { animation-delay: 0.3s; }

@keyframes bnc {
  0%, 100% { transform: translateY(0); opacity: 0.5; }
  50% { transform: translateY(-7px); opacity: 1; }
}

#inputarea {
  border-top: 1px solid var(--border);
  padding: 12px 16px;
  padding-bottom: calc(14px + env(safe-area-inset-bottom));
  flex-shrink: 0;
  background: rgba(247,243,236,0.92);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  position: sticky;
  bottom: 0;
}

#irow { display: flex; gap: 8px; align-items: flex-end; }

#micBtn {
  border: 1px solid var(--border-2) !important;
  background: var(--surface-2) !important;
  color: var(--gray-mid) !important;
  width: 44px !important;
  height: 44px !important;
  border-radius: 50% !important;
  cursor: pointer !important;
  font-size: 18px !important;
  flex-shrink: 0 !important;
  box-shadow: var(--shadow-sm) !important;
}

#inp {
  flex: 1;
  background: var(--surface);
  border: 1px solid var(--border-2);
  border-radius: 14px;
  color: var(--ink);
  padding: 12px 16px;
  font-size: 15px;
  line-height: 1.5;
  font-family: inherit;
  outline: none;
  resize: none;
  max-height: 120px;
  overflow-y: auto;
  min-height: 44px;
  -webkit-appearance: none;
  font-weight: 500;
  box-shadow: var(--shadow-sm);
  transition: all 0.15s;
}

#inp::placeholder { color: var(--gray-light); }
#inp:focus { border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold-soft); }

#sbtn {
  border: none;
  border-radius: 14px;
  color: #1a1505;
  background: var(--gold-grad);
  width: 44px;
  height: 44px;
  font-size: 18px;
  font-weight: 700;
  cursor: pointer;
  flex-shrink: 0;
  -webkit-tap-highlight-color: transparent;
  box-shadow: 0 4px 16px rgba(201,162,75,0.4);
  transition: all 0.15s;
}

#sbtn:hover { transform: translateY(-1px); box-shadow: 0 6px 24px rgba(201,162,75,0.5); }
#sbtn:disabled { background: var(--surface-2) !important; color: var(--gray-light); box-shadow: none; cursor: not-allowed; }

#disc { text-align: center; margin-top: 8px; font-size: 10px; color: var(--gray-light); letter-spacing: 0.02em; }

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.card { animation: fadeIn 0.5s cubic-bezier(0.4, 0, 0.2, 1) both; }
.card:nth-child(1) { animation-delay: 0.05s; }
.card:nth-child(2) { animation-delay: 0.10s; }
.card:nth-child(3) { animation-delay: 0.15s; }
.card:nth-child(4) { animation-delay: 0.20s; }
.card:nth-child(5) { animation-delay: 0.25s; }
.card:nth-child(6) { animation-delay: 0.30s; }
.card:nth-child(7) { animation-delay: 0.35s; }
.card:nth-child(8) { animation-delay: 0.40s; }
.card:nth-child(9) { animation-delay: 0.45s; }
.card:nth-child(10) { animation-delay: 0.50s; }
.card:nth-child(11) { animation-delay: 0.55s; }
.card:nth-child(12) { animation-delay: 0.60s; }

/* ============================================================
   DARK-LUXE OVERRIDES — normalize legacy inline styles
   ============================================================ */

/* tdot accent */
.tdot { background: var(--gold) !important; }

/* Daily quote card */
#dailyQuote {
  background: linear-gradient(160deg, var(--surface), var(--bg-2)) !important;
  border: 1px solid var(--gold-line) !important;
  border-top: 2px solid var(--gold) !important;
  border-radius: 18px !important;
  box-shadow: var(--shadow) !important;
  color: var(--ink) !important;
}
#dailyQuote * { color: var(--ink-soft) !important; }
#dailyQuote .dq-mark, #dailyQuote .gild { color: var(--gold-light) !important; -webkit-text-fill-color: var(--gold-light) !important; }

/* Home quick-action buttons — unify to luxe pills */
#quickActions button, #quickActions2 button {
  background: var(--surface) !important;
  border: 1px solid var(--border-2) !important;
  border-radius: 14px !important;
  color: var(--ink-soft) !important;
  font-family: var(--font-body) !important;
  box-shadow: var(--shadow-sm) !important;
  letter-spacing: 0.02em !important;
  transition: all 0.18s !important;
  position: relative;
}
#quickActions button:hover, #quickActions2 button:hover {
  border-color: var(--gold) !important;
  color: var(--gold-light) !important;
  transform: translateY(-2px);
}
/* Primary CTA: Ask Board */
#quickActions button[onclick*="openHomeBoardRoom"] {
  background: var(--gold-grad) !important;
  border: none !important;
  color: #1a1505 !important;
  font-weight: 700 !important;
  box-shadow: 0 6px 20px rgba(201,162,75,0.3) !important;
}
#quickActions button[onclick*="openHomeBoardRoom"]:hover { color: #1a1505 !important; box-shadow: 0 10px 28px rgba(201,162,75,0.45) !important; }
/* Arena button — keep dark, gold text, with sheen */
#quickActions2 button[onclick*="openArena"] {
  background: linear-gradient(135deg, #1a1608, #0e0c06) !important;
  border: 1px solid var(--gold-line) !important;
  color: var(--gold-light) !important;
  font-weight: 800 !important;
  letter-spacing: 0.12em !important;
}

/* Search bar — was invisible white-on-white */
#searchInp {
  background: var(--surface) !important;
  border: 1px solid var(--border-2) !important;
  color: var(--ink) !important;
  border-radius: 100px !important;
  box-shadow: var(--shadow-sm) !important;
}
#searchInp::placeholder { color: var(--gray-light) !important; }
#searchInp:focus { border-color: var(--gold) !important; outline: none; box-shadow: 0 0 0 3px var(--gold-soft) !important; }

/* Reminder badge */
#reminderBadge { background: var(--gold) !important; color: #1a1505 !important; display:none; }

/* ---- Global overlay normalization (Decision Log, Goals, Settings, Board, History, Reminders) ---- */
[id$="Overlay"], #decisionLogOverlay, #goalsOverlay, #settingsOverlay,
#boardHistoryOverlay, #boardRoomOverlay, #homeBoardOverlay {
  background: var(--bg) !important;
}
/* Any leftover purple/indigo borders & text → gold/ink */
[style*="99,102,241"], [style*="6366f1"], [style*="a855f7"], [style*="168,85,247"] {
  border-color: var(--gold-line) !important;
}
/* Old near-white panel fills → dark surface */
[style*="#f3f4f6"] { background: var(--surface) !important; color: var(--ink) !important; }

<script>
const CORE_RULES = `
HOW YOU MUST THINK (CRITICAL — READ TWICE):
0. UNDERSTAND BEFORE ADVISING — Read the user's message carefully. What are they REALLY asking? What's the underlying business problem? What context is missing? If you don't understand, ASK before advising.
1. REASON FROM YOUR REAL PAST — Not textbook advice. Pull from actual decisions, deals, failures. Reference specific years, names, dollar amounts from YOUR life.
2. IF YOU DON'T KNOW, SAY SO — Never invent facts. Say: "Honestly, I don't have direct experience with that — but here's how I'd think about it..." or "I don't know. Anyone claiming certainty is lying."
3. THINK LIKE A REAL ADVISOR (not a chatbot):
   - Ask: What numbers do I need? Costs? Margins? Risks?
   - Consider: 1st order effects vs 2nd order effects
   - Stress-test: What if it goes wrong? What's the worst case?
   - Compare: 3 different options with trade-offs
   - Time horizon: What changes in 6 months vs 5 years?
4. SPEAK IN POSSIBILITIES, NOT ABSOLUTES — Frame as exploration:
   - "IF you do X, THEN Y might happen — but watch for Z"
   - "Three paths I see: Option A... Option B... Trade-offs..."
   - NEVER "you must" or "this is the only way"
4. SHOW REASONING — Walk through HOW you arrived at the thought: "Let me think... First the market is... Second your competition... So..."
5. ACKNOWLEDGE UNCERTAINTY — "Best guess but I've been wrong many times" — "Probabilities, not promises"
6. ACT AS AGENT — Ask probing questions BEFORE advising. Challenge weak thinking. Set firm boundaries on off-topic asks (gossip/politics/medical/legal/relationships) — redirect: "Not where I add value."
7. CONTEXT MATTERS — If user mentions Sri Lanka, glove factory, goat farming, family business, partnerships, or any specific business situation, use that context. Don't give generic advice — make it SPECIFIC to their situation.
8. GO DEEPER — Don't give surface answers. Probe: What's the real risk? What's the real opportunity cost? What numbers matter? What would a smart enemy say to attack this plan?
9. END WITH ACTION — Always end with: a clear next step OR a clarifying question OR a specific number/decision they need to make. Never end vague.
10. RESPECT THE PERSON — ALWAYS. You can challenge the IDEA hard, but never attack the PERSON. Never insult them, mock them, call them stupid/foolish, or say things that crush their confidence or make them doubt their own worth. Critique the plan, not the human. Be honest and direct, but keep your respect for them intact — push them to think better, never make them feel small. If their idea is weak, say so kindly and show them a better way. Leave them stronger and clearer, never hurt or discouraged.
7. STAY IN CHARACTER — Never break the fourth wall. You ARE this person.
`;

const MODES = {

  pitch:"\n\nMODE: PITCH EVALUATOR. Announce 'I'm treating this as a pitch.' Ask exactly 3 sharp questions about: market size, competition, unfair advantage. ONLY after they respond, give an honest, direct score /10, success probability %, top 3 improvements. Be straight about weaknesses but respectful of the person — critique the pitch, not them. Reason from a real similar pitch from your past.",
  predict:"\n\nMODE: PREDICTION. Announce 'Let me think about this as a forecast.' Give specific predictions with probability estimates. Reason from historical patterns you personally lived through. End with 'Here's what I'd do NOW to prepare...'",
  ideas:"\n\nMODE: IDEA GENERATOR. Announce 'Let me brainstorm with you.' Give 5+ unconventional ideas framed as 'IF you do X, THEN Y might happen because...' Include first concrete step for each.",
  plan:"\n\nMODE: PLAN BUILDER. Announce 'Let me help build a real plan.' First ask what resources they have. Then build 30-day, 90-day, 1-year milestones. Identify #1 risk and mitigation. Reference a real plan you executed.",
  challenge:"\n\nMODE: CHALLENGER. Announce 'I'm going to push back hard.' Find holes in their LOGIC and PLAN — not in them as a person. Ask uncomfortable questions about the idea. Play devil's advocate using a real failure you experienced as the lens. Stay respectful of the person throughout — challenge the thinking, never belittle them."
};

function detectMode(text) {
  const t = text.toLowerCase();
  if (/(my idea|i want to build|i'm building|pitch|evaluate.*business|review.*startup|thoughts on my)/.test(t)) return 'pitch';
  if (/(predict|what will happen|future of|next \d+ years|forecast|trend|prediction)/.test(t)) return 'predict';
  if (/(give me ideas|brainstorm|suggest|what should i do|recommend|options for)/.test(t)) return 'ideas';
  if (/(how do i|build.*plan|roadmap|steps to|plan for|strategy to)/.test(t)) return 'plan';
  if (/(challenge me|poke holes|what's wrong|devil's advocate|criticize)/.test(t)) return 'challenge';
  return 'chat';
}

${t.safety ? t.safety + '\n\n' : ''}${CORE_RULES}`;

// Called when user taps "Generate" for a typed name in a category
async function generateAdvisor(rawName) {
  const name = (rawName || '').trim();
  if (!name) return;
  const catId = currentCategory || 'business';
  const cat = getCategoryById(catId);
  const gen = CATEGORY_GEN[catId] || CATEGORY_GEN.business;

  // Loading card while we look up who they could be
  const grid = document.getElementById('grid');
  const loading = document.createElement('div');
  loading.className = 'card';
  loading.id = 'genLoading';
  loading.style.setProperty('--ac', cat.color);
  loading.innerHTML = `<span class="card-emoji">🔍</span><div class="card-name">Finding ${name}…</div><div class="card-sub">Looking up who this could be</div><span class="card-tag">PLEASE WAIT</span>`;
  if (grid) grid.insertBefore(loading, grid.firstChild);

  const findPrompt = `A user typed the name "${name}" while looking for ${gen.role} in the category "${cat.name}" (${gen.focus}).

List ONLY real, publicly-known people you are genuinely confident actually exist with this name. Put the best fit for THIS category first.

Return ONLY valid JSON (no markdown):
{
  "matches": [
    { "name": "full correct name", "who": "8-12 words on who they are", "fits": true/false }
  ]
}

ABSOLUTE RULES — these protect users from false information:
- NEVER invent or guess a person. If you are not genuinely sure a real person exists, DO NOT list them.
- Do NOT fill the list to reach the category. It is completely fine to return people from other fields, or to return an empty list.
- Only include someone if you actually know real facts about them (real work, real achievements). If you'd have to make up their background, leave them out.
- "fits" = true only if they genuinely belong in "${cat.name}" (${gen.focus}); false otherwise.
- If you do NOT confidently know ANY real person with this exact name, return {"matches": []}. An empty list is the correct, honest answer when you don't know them.
- Better to return nothing than to invent someone.`;

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-5',
        max_tokens: 500,
        messages: [{ role: 'user', content: findPrompt }],
        system: 'You identify which real people match a given name. Return ONLY valid JSON. Never invent people.'
      })
    });
    const data = await res.json();
    let text = (data.content || []).filter(b => b.type === 'text').map(b => b.text).join('');
    text = text.replace(/```json|```/g, '').trim();
    const fb = text.indexOf('{'), lb = text.lastIndexOf('}');
    if (fb !== -1 && lb !== -1) text = text.slice(fb, lb + 1);
    let matches = [];
    try { matches = (JSON.parse(text).matches) || []; } catch(e) { matches = []; }

    const l = document.getElementById('genLoading'); if (l) l.remove();

    if (!matches.length) {
      // Honest: the AI doesn't confidently know this person. Do NOT invent them.
      alert(`I couldn't find a well-known "${name}" in ${cat.name}.\n\nThis usually means they aren't widely documented enough to build accurately — so rather than make up details, nothing is added.\n\nTry the full correct name, or a more well-known person.`);
      return;
    }
    if (matches.length === 1) {
      // Only one — go straight to building
      buildAdvisorProfile(matches[0].name, matches[0].who || '');
      return;
    }
    // Several — show a pick list
    showMatchPicker(name, matches);
  } catch(e) {
    const l = document.getElementById('genLoading'); if (l) l.remove();
    alert("Couldn't search that name.\n\nReason: " + (e && e.message ? e.message : 'unknown') + "\n\n(The AI backend must be reachable — same as your chat.)");
  }
}

// Build the full advisor profile for a CONFIRMED person
async function buildAdvisorProfile(rawName, whoHint) {
  const name = (rawName || '').trim();
  if (!name) return;
  const catId = currentCategory || 'business';
  const cat = getCategoryById(catId);
  const gen = CATEGORY_GEN[catId] || CATEGORY_GEN.business;

  const grid = document.getElementById('grid');
  const loading = document.createElement('div');
  loading.className = 'card';
  loading.id = 'genLoading';
  loading.style.setProperty('--ac', cat.color);
  loading.innerHTML = `<span class="card-emoji">✨</span><div class="card-name">Creating ${name}…</div><div class="card-sub">Building advisor</div><span class="card-tag">PLEASE WAIT</span>`;
  if (grid) grid.insertBefore(loading, grid.firstChild);

  const genPrompt = `Create an advisor profile for "${name}"${whoHint ? ' ('+whoHint+')' : ''} as ${gen.role}, for an app where users get advice from notable people.

Focus on: ${gen.focus}.

Return ONLY valid JSON, no markdown, with these fields:
{
  "emoji": "one emoji that represents them",
  "sub": "short line: their field/work · country flag emoji if known (max 6 words)",
  "tag": "a 2-3 word label (e.g. 'Tech Visionary')",
  "summary": "2-3 simple sentences telling the user who this person is and what they're known for, so they can confirm it's who they meant. Plain, friendly English.",
  "greeting": "first thing they'd say to someone seeking their advice — in their real voice, 1-2 sentences",
  "qs": ["4 short starter questions a user might tap, in their domain"],
  "persona": "A rich 150-220 word first-person-ready description so an AI can fully BECOME this person. Include: their real background and 3-5 SPECIFIC career-defining events/decisions (with rough years, projects, or numbers if known), their core philosophy and signature way of thinking, how they speak, and the kind of advice they give. Be concrete and factual — name real things they did, not vague traits."
}

This person is specifically: ${whoHint || 'as known publicly'}. Stay true to THAT person, not someone else with the same name.
If you are not sure of real facts, keep the persona honest rather than inventing details.`;

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-5',
        max_tokens: 900,
        messages: [{ role: 'user', content: genPrompt }],
        system: 'You build concise, accurate advisor profiles of notable people. Return ONLY valid JSON.'
      })
    });
    const data = await res.json();
    let text = (data.content || []).filter(b => b.type === 'text').map(b => b.text).join('');
    text = text.replace(/```json|```/g, '').trim();
    const firstBrace = text.indexOf('{');
    const lastBrace = text.lastIndexOf('}');
    if (firstBrace !== -1 && lastBrace !== -1) text = text.slice(firstBrace, lastBrace + 1);
    let prof;
    try { prof = JSON.parse(text); }
    catch(parseErr) {
      prof = { persona: 'You are ' + name + ', ' + (CATEGORY_GEN[catId]||CATEGORY_GEN.business).role + '. Reason and speak as this person would, drawing on what they are publicly known for.', summary: "We couldn't load full details, but you can still add them and start chatting." };
    }

    const safety = catId === 'health' ? HEALTH_SAFETY : catId === 'mindset' ? MINDSET_SAFETY : '';
    const advisor = {
      id: 'gen_' + Date.now(),
      name,
      emoji: prof.emoji || cat.emoji,
      sub: prof.sub || cat.name,
      tag: prof.tag || cat.name.split(' ')[0],
      persona: prof.persona || (name + ' — ' + gen.role),
      greeting: prof.greeting || `Hello, I'm ${name}. What would you like to talk about?`,
      qs: Array.isArray(prof.qs) && prof.qs.length ? prof.qs.slice(0,4) : ['Give me advice','Help me decide','What should I focus on?','Share your wisdom'],
      cat: catId,
      ac: cat.color,
      grad: `linear-gradient(135deg, ${cat.color}, #1a1608)`,
      safety,
      isCustom: true,
      generated: true
    };
    // Remove loading card, show a PREVIEW so the user confirms it's the right person
    const l = document.getElementById('genLoading'); if (l) l.remove();
    showAdvisorPreview(advisor, prof.summary || '');
    return;
  } catch(e) {
    const l = document.getElementById('genLoading'); if (l) l.remove();
    alert("Couldn't create " + name + ".\n\nReason: " + (e && e.message ? e.message : 'unknown') + "\n\nThis usually means the AI backend isn't reachable. Your Tycoon chat must be working for Generate to work — they use the same connection.");
  }
}

function getMemKey() { return `tycoon_mem_${current?.name?.replace(/\s/g,'_')}`; }
function saveMem(k, v) {
  const m = JSON.parse(localStorage.getItem(getMemKey()) || '{}');
  m[k] = v; m.updated = new Date().toLocaleDateString();
  localStorage.setItem(getMemKey(), JSON.stringify(m));
}
function getMem() { return JSON.parse(localStorage.getItem(getMemKey()) || '{}'); }
function toggleMem() {
  const p = document.getElementById('memPanel');
  p.style.display = p.style.display === 'none' ? 'block' : 'none';
  updateMemPanel();
}
function updateMemPanel() {
  const m = getMem();
  const keys = Object.keys(m).filter(k => k !== 'updated');
  if (!keys.length) {
    document.getElementById('memContent').textContent = 'Nothing saved yet. Have a conversation and I will start remembering key things.';
  } else {
    document.getElementById('memContent').innerHTML = keys.map(k => `<b style="color:#9ca3af">${k}:</b> ${m[k]}`).join('<br/>') + (m.updated ? `<br/><span style="color:#a1a1a6;font-size:10px">Last updated ${m.updated}</span>` : '');
  }
}
function clearMem() { localStorage.removeItem(getMemKey()); updateMemPanel(); }

function debugAdvisor() {
  if (!current) { alert('No advisor open'); return; }
  const sys = buildSystem();
  const info =
    'NAME: ' + (current.name || '(none)') +
    '\nisCustom: ' + current.isCustom +
    '\ngenerated: ' + current.generated +
    '\nhas .system: ' + (current.system ? 'YES ('+current.system.length+' chars)' : 'NO') +
    '\nhas .persona: ' + (current.persona ? 'YES ('+current.persona.length+' chars)' : 'NO') +
    '\n\n--- SYSTEM PROMPT BEING SENT (first 300 chars) ---\n' +
    (sys ? sys.slice(0,300) : '(EMPTY!)');
  alert(info);
}

function buildSystem() {
  const useMode = mode === 'auto' ? detectedMode : mode;
  const modeExtra = MODES[useMode] || '';
  const m = getMem();
  const memKeys = Object.keys(m).filter(k => k !== 'updated');
  const memContext = memKeys.length ? `\nWHAT YOU REMEMBER ABOUT THE USER:\n${memKeys.map(k=>`${k}: ${m[k]}`).join('\n')}` : '';
  const nameContext = userName ? `\nThe user's name is ${userName}. Use it naturally.` : '';
  // Use buildSystemPrompt so generated/custom advisors get their full persona (not just built-in .system)
  const base = (typeof buildSystemPrompt === 'function') ? buildSystemPrompt(current) : (current.system || '');
  return base + modeExtra + memContext + nameContext;
}

function extractAndSaveMem(reply) {
  const goalMatch = reply.match(/(?:your|the) goal (?:is |seems to be |of )([^.!?]+)/i);
  if (goalMatch) saveMem('goal', goalMatch[1].trim());
  const bizMatch = reply.match(/your (?:business|startup|company)[,\s]+([^.!?]+)/i);
  if (bizMatch) saveMem('business', bizMatch[1].trim());
  if (userName) saveMem('name', userName);
}

async function sendMsg() {
  const inp = document.getElementById('inp');
  const text = inp.value.trim();
  if (!text || busy) return;

  // Type "/debug" to see what this advisor is sending (diagnostic)
  if (text.toLowerCase() === '/debug') {
    inp.value = '';
    const sys = buildSystem();
    const report =
      'NAME: ' + (current && current.name || '(none)') +
      '\nisCustom: ' + (current && current.isCustom) +
      '\ngenerated: ' + (current && current.generated) +
      '\nhas .system: ' + (current && current.system ? 'YES (' + current.system.length + ')' : 'NO') +
      '\nhas .persona: ' + (current && current.persona ? 'YES (' + current.persona.length + ')' : 'NO') +
      '\n\nSYSTEM PROMPT SENT (first 300):\n' + (sys ? sys.slice(0,300) : '(EMPTY)');
    addBubble('ai', report);
    return;
  }

  if (busy) return;
  busy = true; inp.value = ''; updateBtn();
  document.getElementById('chipswrap').style.display = 'none';

  // Auto-detect mode
  if (mode === 'auto') {
    detectedMode = detectMode(text);
    document.getElementById('modeLabel').textContent = `✨ Auto → ${MODE_LABELS[detectedMode]}`;
  }

  history.push({ role: 'user', content: text });
  addBubble('user', text);
  document.getElementById('typingrow').style.display = 'flex';
  scrollDown();

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-5',
        max_tokens: getThinkingMode() === 'deep' ? 16000 : 2500,
        ...(getThinkingMode() === 'deep' ? { thinking: { type: 'enabled', budget_tokens: 12000 } } : {}),
        system: buildSystem(),
        messages: history
      })
    });
    const data = await res.json();
    // If the backend returned an error (no content), show it so we can diagnose
    if (!data.content || !data.content.length) {
      const errMsg = data.error
        ? (typeof data.error === 'string' ? data.error : JSON.stringify(data.error))
        : ('No content. Raw response: ' + JSON.stringify(data).slice(0, 300));
      document.getElementById('typingrow').style.display = 'none';
      addBubble('ai', '⚠️ Backend error: ' + errMsg);
      busy = false; updateBtn();
      return;
    }
    const reply = (data.content || []).filter(b => b.type === 'text').map(b => b.text).join('') || 'Let us try again.';
    const hadThinking = (data.content || []).some(b => b.type === 'thinking');
    history.push({ role: 'assistant', content: reply });
    document.getElementById('typingrow').style.display = 'none';
    addBubble('ai', reply, hadThinking, mode === 'auto' ? detectedMode : mode);
    extractAndSaveMem(reply);
    extractReminders(text, reply);
  } catch(e) {
    document.getElementById('typingrow').style.display = 'none';
    addBubble('ai', 'Connection issue. Please try again.');
  }
  busy = false; updateBtn();
}

function addBubble(role, text, hadThinking = false, usedMode = null) {
  // Show Board Room button after first AI response
  if (role === 'ai' && history.length > 0) {
    const bbtn = document.getElementById('boardFloatBtn');
    if (bbtn) bbtn.style.display = 'inline-block';
    saveChatHistory();
  }
  const msgs = document.getElementById('msgs');
  const typingrow = document.getElementById('typingrow');
  const wrap = document.createElement('div');
  wrap.className = 'msg' + (role === 'user' ? ' user' : '');
  if (role === 'ai') {
    const av = document.createElement('div');
    av.className = 'mav'; av.style.background = current.grad; av.textContent = current.emoji;
    wrap.appendChild(av);
  }
  const col = document.createElement('div');
  if (role === 'ai' && (hadThinking || usedMode)) {
    const badges = document.createElement('div');
    if (hadThinking) {
      const b = document.createElement('span'); b.className = 'badge'; b.textContent = '🧠 Deep thinking'; badges.appendChild(b);
    }
    if (usedMode && usedMode !== 'chat') {
      const b = document.createElement('span'); b.className = 'badge'; b.textContent = MODE_LABELS[usedMode]; b.style.color = current.ac; badges.appendChild(b);
    }
    col.appendChild(badges);
  }
  const bub = document.createElement('div');
  bub.className = 'bub ' + role;
  bub.textContent = text;
  col.appendChild(bub);
  if (role === 'ai') {
    const acts = document.createElement('div'); acts.className = 'msg-actions';
    const copyBtn = document.createElement('button');
    copyBtn.className = 'msg-act';
    copyBtn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-2px;margin-right:5px"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>Copy';
    copyBtn.title = 'Copy message';
    copyBtn.onclick = () => { 
      navigator.clipboard.writeText(text); 
      copyBtn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#34d399" stroke-width="2.5" style="vertical-align:-2px;margin-right:5px"><polyline points="20 6 9 17 4 12"/></svg><span style="color:#34d399">Copied!</span>'; 
      setTimeout(()=>{
        copyBtn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-2px;margin-right:5px"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>Copy';
      },1500); 
    };
    acts.appendChild(copyBtn);
    
    // Add Share button (like Claude)
    const shareBtn = document.createElement('button');
    shareBtn.className = 'msg-act';
    shareBtn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-2px;margin-right:5px"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>Share';
    shareBtn.title = 'Share via WhatsApp/etc';
    shareBtn.onclick = async () => {
      const tycoonName = current?.name || 'Tycoon';
      const shareText = `💡 ${tycoonName} said:\n\n${text}\n\n— via My Tycoon Advisors`;
      if (navigator.share) {
        try {
          await navigator.share({ title: tycoonName + " - My Tycoon Advisors", text: shareText });
        } catch(e) {
          navigator.clipboard.writeText(shareText);
          shareBtn.innerHTML = '<span style="color:#34d399">✓ Copied to share</span>';
          setTimeout(()=>shareBtn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-2px;margin-right:5px"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>Share', 1500);
        }
      } else {
        navigator.clipboard.writeText(shareText);
        shareBtn.innerHTML = '<span style="color:#34d399">✓ Copied to share</span>';
        setTimeout(()=>shareBtn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-2px;margin-right:5px"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>Share', 1500);
      }
    };
    acts.appendChild(shareBtn);
    
    col.appendChild(acts);
  }
  wrap.appendChild(col);
  msgs.insertBefore(wrap, typingrow);
  scrollDown();
}

function scrollDown() { const m = document.getElementById('msgs'); m.scrollTop = m.scrollHeight; }
function updateBtn() { document.getElementById('sbtn').disabled = busy || !document.getElementById('inp').value.trim(); }








// ── THINKING MODE TOGGLE ──
function getThinkingMode() {
  return localStorage.getItem('thinking_mode') || 'deep';
}

function toggleThinkingMode() {
  const current = getThinkingMode();
  const newMode = current === 'deep' ? 'quick' : 'deep';
  localStorage.setItem('thinking_mode', newMode);
  updateThinkingButton();
  
  // Show notification
  const banner = document.createElement('div');
  const isDeep = newMode === 'deep';
  banner.style.cssText = 'position:fixed;top:20px;left:50%;transform:translateX(-50%);background:' + (isDeep ? 'linear-gradient(135deg,#6e2cf4,#ec4899)' : 'linear-gradient(135deg,#10b981,#06b6d4)') + ';color:#2B2620;padding:12px 22px;border-radius:100px;z-index:99999;font-family:Inter,sans-serif;font-weight:700;font-size:12px;letter-spacing:0.04em;text-transform:uppercase;box-shadow:0 8px 30px rgba(0,0,0,0.3)';
  banner.innerHTML = isDeep ? '🧠 Deep Thinking ON · slower, smarter, costs more' : '🚀 Quick Mode ON · faster, cheaper, less depth';
  document.body.appendChild(banner);
  setTimeout(() => banner.remove(), 3000);
}

function updateThinkingButton() {
  const btn = document.getElementById('thinkToggle');
  if (!btn) return;
  const mode = getThinkingMode();
  if (mode === 'deep') {
    btn.innerHTML = '🧠 Deep';
    btn.style.background = 'rgba(168,85,247,0.15)';
    btn.style.borderColor = 'rgba(168,85,247,0.3)';
    btn.style.color = '#c4b5fd';
    btn.title = 'Deep thinking - smarter but costs more. Tap to switch to Quick mode.';
  } else {
    btn.innerHTML = '🚀 Quick';
    btn.style.background = 'rgba(16,185,129,0.15)';
    btn.style.borderColor = 'rgba(16,185,129,0.3)';
    btn.style.color = '#34d399';
    btn.title = 'Quick mode - faster and cheaper. Tap to switch to Deep mode.';
  }
}
